const getAniBotReply = (txt) => {
  const l=txt.toLowerCase();
  if(l.includes('recommend')||l.includes('suggest')||l.includes('what should i watch')) return ANIBOT_RESPONSES.recommend;
  if(l.includes('levi')||l.includes('gojo')||l.includes('luffy')||l.includes('naruto char')||l.includes('character')) return ANIBOT_RESPONSES.character;
  if(l.includes('analyz')||l.includes('taste')||l.includes('personality')) return ANIBOT_RESPONSES.analyze;
  if(l.includes(' vs ')||l.includes('stronger')||l.includes('who would win')) return ANIBOT_RESPONSES.vs;
  if(l.includes('friend')||l.includes('watch with')||l.includes('watch party')) return ANIBOT_RESPONSES.friends;
  const facts=['Did you know? One Piece has been running since 1997 and Oda still has more story planned 🏴‍☠️','The Chimera Ant arc of HxH is widely considered the greatest in all of shonen anime 🐜','Demon Slayer\'s Mugen Train became the highest-grossing anime film ever 🔥','Attack on Titan\'s ending was decided before chapter 1 was even written ⚔️','Frieren won the Anime of the Year award at the 2024 Crunchyroll Awards ✨'];
  return `Great question! 🤔\n\n${facts[Math.floor(Math.random()*facts.length)]}\n\nAsk me anything — recommendations, character info, debates, or taste analysis! ✨`;
};

const TrueFan = () => {
  const { plus, toast, t } = useApp();
  const [stage, setStage] = useState('select'); // select | quiz | result
  const [sel, setSel] = useState(null);
  const [search, setSearch] = useState('');
  const [qs, setQs] = useState([]);
  const [q, setQ] = useState(0);
  const [ms, setMs] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [picked, setPicked] = useState(null);
  const [showRank, setShowRank] = useState(true);
  const [attempts, setAttempts] = useState(3);
  const startRef = useRef(0);
  useEffect(() => {
    if (stage!=='quiz') return;
    startRef.current = Date.now() - ms;
    const id = setInterval(()=>setMs(Date.now()-startRef.current), 31);
    return ()=>clearInterval(id);
  }, [stage]);
  const fmtTime = (m) => { const s=Math.floor(m/1000); const mm=String(Math.floor(s/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); const cc=String(Math.floor((m%1000)/10)).padStart(2,'0'); return `${mm}:${ss}.${cc}`; };
  const shuffle = (a) => { const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; };
  const buildQuestions = (id) => {
    const pool = CHARACTERS[id] || ['A','B','C','D'];
    return Array.from({length:10}).map((_,k)=>{ const ans=pool[k%pool.length]; const others=shuffle(pool.filter(n=>n!==ans)).slice(0,2); const opts=shuffle([ans,...others]); return { char:ans, opts, a:opts.indexOf(ans) }; });
  };
  const begin = () => { if(!sel) return; if(attempts<=0 && !plus){ toast('No attempts left — go AniPlus for ∞','warn'); return; } setQs(buildQuestions(sel)); setStage('quiz'); setQ(0); setMs(0); setCorrect(0); setPicked(null); };

    const ok = i===qs[q].a; if(ok) setCorrect(c=>c+1);
    setTimeout(()=>{ if(q+1>=qs.length){ if(!plus) setAttempts(a=>Math.max(0,a-1)); setStage('result'); } else { setQ(q+1); setPicked(null); } }, ok?550:1050);
  };

  if (stage==='select') {
    const list = TF_ANIME_IDS.map(A).filter(a=>!search || a.short.toLowerCase().includes(search.toLowerCase()) || a.title.toLowerCase().includes(search.toLowerCase()));

        </div>
        <div className="px-4 flex-1 flex flex-col justify-center">
          <div className="relative flex flex-col items-center mb-5">
            <CharAvatar name={cur.char} size={150} />

                <span className="flex-1">{o}</span>{mark && <span>{mark}</span>}
              </button>
            );
          })}</div>
        </div>
      </div>
    );
  }

  const finalMs = ms; const acc = Math.round(correct/10*100); const a = A(sel);
  return (
    <div className="pb-28">
      <SubHeader title="Results" sub={a.short} />
      <div className="px-4 pt-4 text-center">
        <div className="glass rounded-2xl p-5 mb-3" style={{background:'linear-gradient(140deg,rgba(139,92,246,.2),rgba(34,211,238,.12))'}}>

    </div>

};

const StoryViewer = () => {
  const { story, setStory } = useApp();
  if (!story) return null;
  const s = STORIES[story.i];
  const frame = s.frames[story.f];
  const next = () => { if(story.f+1 < s.frames.length) setStory({...story,f:story.f+1}); else if(story.i+1 < STORIES.length) setStory({i:story.i+1,f:0}); else setStory(null); };
  const prev = () => { if(story.f>0) setStory({...story,f:story.f-1}); else if(story.i>0) setStory({i:story.i-1,f:STORIES[story.i-1].frames.length-1}); };
  const a = frame.anime ? A(frame.anime) : null;
  return (
    <div className="absolute inset-0 z-[90]" style={{ background:`linear-gradient(160deg, ${frame.g[0]}, ${frame.g[1]})` }}>
      <div className="absolute inset-0" style={{ background:'radial-gradient(90% 60% at 50% 30%, rgba(255,255,255,.15), transparent 55%)' }}/>
      {a && <div className="absolute font-grotesk font-bold leading-none select-none" style={{ right:-30, bottom:'15%', fontSize:260, color:'rgba(255,255,255,.12)' }}>{a.kanji}</div>}
      {/* progress bars */}
      <div className="absolute top-3 inset-x-3 flex gap-1 z-20">{s.frames.map((_,i)=>(
        <div key={i} className="h-0.5 flex-1 rounded-full overflow-hidden bg-white/30"><div className="h-full bg-white" style={ i<story.f ? {width:'100%'} : i===story.f ? {animation:'storybar 4s linear forwards'} : {width:'0%'}} onAnimationEnd={i===story.f?next:undefined}/></div>
      ))}</div>
      <div className="absolute top-6 inset-x-3 flex items-center gap-2 z-20"><Avatar name={s.user} size={36} verified={U(s.user).verified}/><span className="font-semibold text-sm">{s.user}</span><span className="text-[11px] text-white/70">2h</span><button onClick={()=>setStory(null)} className="tap ml-auto"><Icon n="x" size={24}/></button></div>
      {/* tap zones */}
      <button onClick={prev} className="absolute left-0 top-0 bottom-0 w-1/3 z-10" aria-label="previous"/>
      <button onClick={next} className="absolute right-0 top-0 bottom-0 w-2/3 z-10" aria-label="next"/>
      <div className="absolute bottom-16 inset-x-5 z-0 text-center"><p className="text-xl font-bold leading-snug" style={{textShadow:'0 2px 12px rgba(0,0,0,.4)'}}>{frame.cap}</p>{a && <div className="inline-flex items-center gap-1.5 mt-3 glassdark rounded-full px-3 py-1.5 text-[12px] font-semibold">#{a.short}</div>}</div>
      <div className="absolute bottom-5 inset-x-4 z-20 flex items-center gap-2"><input placeholder={`Reply to ${s.user}…`} className="flex-1 rounded-full px-4 py-2.5 text-sm outline-none placeholder-white/60" style={{background:'rgba(0,0,0,.25)',border:'1px solid rgba(255,255,255,.3)'}}/><button className="tap"><Icon n="heart" size={26}/></button><button className="tap"><Icon n="send" size={24}/></button></div>

  );
};

const RARITY_STYLE = [null,{border:'2px solid #9CA3AF',label:'Common'},{border:'2px solid #10B981',label:'Uncommon'},{border:'2px solid #3B82F6',label:'Rare'},{border:'2px solid #8B5CF6',boxShadow:'0 0 12px rgba(139,92,246,0.6)',label:'Epic'},{border:'2px solid #F59E0B',boxShadow:'0 0 16px rgba(245,158,11,0.8)',label:'Legendary'}];
const pickCard = () => {
  const r = Math.random();
  if(r<0.01) return GACHA_CARDS.filter(c=>c.rarity===5)[Math.floor(Math.random()*2)];
  if(r<0.05) return GACHA_CARDS.filter(c=>c.rarity===4)[Math.floor(Math.random()*3)];
  if(r<0.15) return GACHA_CARDS.filter(c=>c.rarity===3)[Math.floor(Math.random()*4)];
  if(r<0.40) return GACHA_CARDS.filter(c=>c.rarity===2)[Math.floor(Math.random()*3)];
  return GACHA_CARDS.filter(c=>c.rarity===1)[0]||GACHA_CARDS[7];
};
const CardCollection = () => {

  const [opening,setOpening] = useState(null);
  const [revealed,setRevealed] = useState([]);
  const openPack = (count,cost,isgem) => {
    if(isgem){if(gem<cost){toast('Not enough gems 💚','warn');return;}}
    else{if(!spendGold(cost)){return;}}
    const cards = Array.from({length:count},()=>pickCard());
    setOpening(cards);
    setRevealed([]);
    let i=0;
    const t = setInterval(()=>{
      setRevealed(r=>[...r,i]);

      if(i>=cards.length) clearInterval(t);

    <div className="flex flex-col h-full bg-[#0D0D1A]">

        </div>
      </div>
      <div>
        <div className="text-[11px] font-bold text-white/40 uppercase tracking-wide mb-2">Discover Clubs</div>
        <div className="space-y-2.5">{CLUBS_LIST.map(c=>(
          <div key={c.id} className="glass rounded-2xl p-3 flex items-center gap-3">
            <button onClick={()=>setView(c)} className="tap shrink-0 flex items-center justify-center rounded-xl text-2xl" style={{width:52,height:52,background:`linear-gradient(140deg,${c.g[0]},${c.g[1]})`}}>{c.name.match(/[\u{1F300}-\u{1F9FF}]/u)?.[0]||'🎌'}</button>
            <div className="flex-1 min-w-0"><div className="font-semibold text-sm truncate">{c.name}</div><div className="text-[11px] text-white/45">{comma(c.members)} members · <span className={c.type==='Open'?'text-[#10B981]':'text-[#F59E0B]'}>{c.type}</span></div></div>
            <button onClick={()=>toggle(c.id)} className={cx('tap shrink-0 rounded-full px-3 py-1.5 text-[11px] font-bold',joined.has(c.id)?'glass text-white/60':'text-white glow-p')} style={joined.has(c.id)?{}:{background:'linear-gradient(120deg,#8B5CF6,#F472B6)'}}>{joined.has(c.id)?'Joined ✓':'Join'}</button>
          </div>
        ))}</div>
      </div>
    </div>
  );
};

/* ============================ APP (provider + router + phone frame) ============================ */
const SCREENS = { splash:Splash, signup:SignUp, feed:Feed, discover:Discover, mylist:MyList, profile:Profile, anime:AnimeDetail, create:CreateScreen, settings:Settings, wallet:Wallet, anivideos:AniVideos, challenges:Challenges, truefan:TrueFan, rooms:Rooms, seasonal:Seasonal, achievements:Achievements, notifications:Notifications, dms:DMs, aniscan:AniScan, wrapped:Wrapped, observatory:Observatory, anifm:AniFM, cardcollection:CardCollection, bucketlist:BucketList, timecapsule:TimeCapsule, quotecard:QuoteCard, memestudio:MemeStudio, collabwriter:CollabWriter };
const NO_NAV = new Set(['splash','signup','anivideos','dms','create','aniscan','wrapped']);

const AniBotButton = () => {
  const { openAnibot, routeName } = useApp();
  if (NO_NAV.has(routeName)) return null;
  return (
    <button onClick={openAnibot} className="tap absolute z-40 anibot-pulse flex items-center justify-center rounded-full text-white" style={{bottom:76,left:14,width:48,height:48,background:'linear-gradient(135deg,#8B5CF6,#F472B6)',boxShadow:'0 4px 16px rgba(139,92,246,.55)'}}>
      <Icon n="sparkles" size={22}/>
    </button>
  );
};

const PhoneFrame = () => {
  const { route, dir, anibot, closeAnibot } = useApp();
  const Screen = SCREENS[route.name] || Feed;
  const showNav = !NO_NAV.has(route.name);
  return (
    <div dir={dir} className="phone-bg petals relative overflow-hidden flex flex-col" style={{ width:430, maxWidth:'100vw', height:'min(924px,100vh)', borderRadius:'min(44px,5vw)', border:'1px solid rgba(255,255,255,.08)', boxShadow:'0 0 60px rgba(139,92,246,.22), 0 0 0 9px rgba(13,15,26,.92), 0 30px 80px rgba(0,0,0,.6)' }}>
      <StatusBar />
      <div key={route.name+(route.params?JSON.stringify(route.params):'')} className="appear flex-1 min-h-0 overflow-y-auto no-scrollbar relative z-10">
        <Screen params={route.params} />
      </div>
      {showNav && <BottomNav />}
      <AniBotButton />
      {anibot && <div className="absolute inset-0 z-50" style={{top:'25%'}}><AniBotModal onClose={closeAnibot}/></div>}
      <ToastLayer />
      <FloaterLayer />
      <StoryViewer />
      <Sidebar />
      <FabSheet />
      <RatingModal />
      <GoLiveModal />
      <LangSheet />
    </div>
  );
};

const App = () => {
  const [lang, setLang] = useState('en');
  const dir = lang==='ar' ? 'rtl' : 'ltr';
  const t = (k) => (STRINGS[lang] && STRINGS[lang][k]) || STRINGS.en[k] || k;

  const [stack, setStack] = useState([{ name:'splash', params:{} }]);
  const route = stack[stack.length-1];
  const nav = (name, params={}) => setStack(s => [...s, { name, params }]);
  const go = (name, params={}) => setStack([{ name, params }]);
  const back = () => setStack(s => s.length>1 ? s.slice(0,-1) : s);

  const [gold, setGold] = useState(1240);
  const [gem] = useState(85);
  const [streak] = useState(42);
  const [plus, setPlus] = useState(false);

  const [toasts, setToasts] = useState([]);
  const toast = (msg, icon) => { const id = Math.random(); setToasts(x => [...x, { id, msg, icon }]); setTimeout(()=>setToasts(x => x.filter(z => z.id!==id)), 2300); };
  const [floaters, setFloaters] = useState([]);
  const addGold = (n, msg) => { setGold(g => g+n); const id = Math.random(); setFloaters(f => [...f, { id, n }]); setTimeout(()=>setFloaters(f => f.filter(z => z.id!==id)), 1150); if (msg) toast(msg, 'gold'); };
  const spendGold = (n) => { if (gold >= n) { setGold(g => g-n); return true; } toast('Not enough AniGold','warn'); return false; };

  const [likes, setLikes] = useState({});
  const toggleLike = (id, base) => setLikes(L => { const cur = L[id] || { liked:false, count:base }; return { ...L, [id]: { liked:!cur.liked, count: cur.count + (cur.liked?-1:1) } }; });
  const [bookmarks, setBookmarks] = useState({});
  const toggleBookmark = (id) => setBookmarks(B => ({ ...B, [id]: !B[id] }));

  const [follows, setFollows] = useState(SEED_FOLLOWS);
  const cycleFollow = (name) => {
    const cur = follows[name] || 'none';
    const next = cur==='none'?'following' : cur==='following'?'none' : cur==='follow_back'?'friends' : cur==='friends'?'follow_back' : 'none';
    setFollows(F => ({ ...F, [name]: next }));
    const msg = next==='following'?`Following ${name}` : next==='friends'?`You & ${name} are friends 🤝` : next==='none'?`Unfollowed ${name}` : `${name} follows you`;
    toast(msg, next==='friends'?'check':undefined);
  };

  const [myList, setMyList] = useState({});
  const addToList = (id, status='watching') => { setMyList(m => ({ ...m, [id]: status })); toast(`Added ${A(id)?A(id).short:''} to My List ✓`, 'check'); };

  const [tasks, setTasks] = useState([
    { id:'login', label:'Log in today', reward:10, done:true },
    { id:'rate', label:'Rate an anime', reward:20, goal:4, cur:0 },
    { id:'post', label:'Post something', reward:30, goal:1, cur:0 },
  ]);
  const completeTask = (id) => {
    let award = 0;
    setTasks(ts => ts.map(tk => {
      if (tk.id!==id) return tk;
      if (tk.done || (tk.goal && tk.cur>=tk.goal)) return tk;
      award = tk.reward;
      return { ...tk, done:true, cur: tk.goal || tk.cur };
    }));
    if (award) addGold(award, `+${award} AniGold — task complete! ✓`);
  };

  const [ratingFor, setRatingFor] = useState(null);
  const [ratesLeft, setRatesLeft] = useState(4);
  const openRating = (id) => setRatingFor(id);
  const closeRating = () => setRatingFor(null);
  const submitRate = (id, val) => {
    if (ratesLeft<=0 && !plus) { toast('Daily rate limit reached','warn'); return; }
    if (!plus) setRatesLeft(r => Math.max(0, r-1));
    setTasks(ts => ts.map(tk => tk.id==='rate' && !(tk.cur>=tk.goal) ? { ...tk, cur: Math.min(tk.goal, tk.cur+1) } : tk));
    toast(`Rated ${A(id).short}: ${val}/10 ★`, 'check');
    setRatingFor(null);
  };

  const [story, setStory] = useState(null);
  const openStory = (i) => setStory({ i, f:0 });

  const [sidebar, setSidebar] = useState(false);
  const [fab, setFab] = useState(false);
  const [goLive, setGoLive] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const [anibot, setAnibot] = useState(false);

  const ctx = {
    lang, setLang, dir, t,
    route, routeName: route.name, nav, go, back,
    gold, gem, streak, plus, setPlus,
    toasts, toast, floaters, addGold, spendGold,
    likes, toggleLike, bookmarks, toggleBookmark,
    follows, cycleFollow,
    myList, addToList,
    tasks, completeTask,
    ratingFor, openRating, closeRating, ratesLeft, submitRate,
    story, setStory, openStory,
    sidebar, openSidebar:()=>setSidebar(true), closeSidebar:()=>setSidebar(false),
    fab, openFab:()=>setFab(true), closeFab:()=>setFab(false),
    goLive, openGoLive:()=>setGoLive(true), closeGoLive:()=>setGoLive(false),
    langOpen, openLang:()=>setLangOpen(true), closeLang:()=>setLangOpen(false),
    anibot, openAnibot:()=>setAnibot(true), closeAnibot:()=>setAnibot(false),
  };
  return (
    <Ctx.Provider value={ctx}>
      <div className="flex items-center justify-center min-h-screen w-full" style={{ padding:'0' }}>
        <PhoneFrame />
      </div>
    </Ctx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function () {
  function run() {
    try {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(out);
    } catch (e) {
      console.error('AniSphere build error:', e);
      var r = document.getElementById('root');
      if (r) r.innerHTML = '<pre style="color:#F472B6;padding:20px;white-space:pre-wrap;font:12px ui-monospace,monospace">' + (e && e.message ? e.message : e) + '</pre>';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
</body>
</html>
